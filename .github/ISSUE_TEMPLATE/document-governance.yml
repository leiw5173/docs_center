name: 补充发布 PR 的治理信息
description: 文档团队填写表单，自动更新待发布 PR 并重跑检查
title: '[文档治理] '
body:
  - type: markdown
    attributes:
      value: 目录或文档改名通常自动登记旧链接跳转，无需填写本表。无法确定新位置时，从候选 PR 点击“选择新位置”，表单会自动填好，核对后提交即可。本表也用于标签、引用和反馈；正文与 index.md 请回业务仓库修改。
  - type: dropdown
    id: language
    attributes: {label: 发布语言, options: [zh, en]}
    validations: {required: true}
  - type: dropdown
    id: operation
    attributes:
      label: 调整类型
      options: [地址迁移, 标签调整, 引用登记, 文档反馈]
    validations: {required: true}
  - type: input
    id: target
    attributes: {label: 文档标识, description: 从候选 PR 的目标选择链接进入时自动填写；地址迁移表示原来的文档位置，无需手动修改}
    validations: {required: true}
  - type: input
    id: url
    attributes: {label: 引用原地址, description: 仅引用登记填写正文中的原始链接}
  - type: textarea
    id: content
    attributes: {label: 调整内容, description: 地址迁移表示新文档位置，由 PR 的选择链接自动填写；标签用逗号分隔，反馈填写说明}
    validations: {required: true}
