name: 文档仓库接入或调整
description: 选择中文分类，自动生成登记 PR；已有来源保留标识和地址
title: '[文档接入] '
body:
  - type: markdown
    attributes:
      value: >-
        请先阅读[接入填写指南](https://github.com/leiw5173/docs_center/blob/main/docs/repository-registration.md)和[分类目录表](https://github.com/leiw5173/docs_center/blob/main/docs/category-catalog.md)。只登记来源，不直接发布正文。无需填写栏目代码、子类
        ID、地址前缀或目录层级。
  - type: input
    id: repository
    attributes:
      label: 来源仓库
      description: 从业务仓库地址复制 owner/repository，例如 spacemit-com/docs-courses；不要填写网页完整网址。
      placeholder: owner/repository
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: 分支
      description: 新接入默认 main；默认分支为 master 等名称时请明确填写。调整已有来源时，留空沿用已登记分支。
      placeholder: main
  - type: dropdown
    id: languages
    attributes:
      label: 语言
      description: 按实际存在的 zh、en 文档目录选择；缺少英文不阻断中文接入。
      multiple: true
      options:
        - zh
        - en
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 目标分类
      description: 选择希望展示的位置。栏目、子类 ID 和分类路径自动关联；不在列表中的分类请先提交分类申请。
      options:
        - 硬件
        - 硬件 / 芯片
        - 硬件 / 板卡与整机
        - 硬件 / 支持与服务
        - 操作系统
        - 操作系统 / Bianbu
        - 操作系统 / OpenWrt
        - 操作系统 / Buildroot
        - 操作系统 / OpenHarmony
        - 操作系统 / 其他生态系统
        - 操作系统 / 镜像安装
        - AI软件栈
        - AI软件栈 / 应用软件栈
        - AI软件栈 / 计算软件栈
        - AI软件栈 / 计算架构
        - 应用案例
        - 应用案例 / Robot 应用
        - 应用案例 / Computer 应用
        - 应用案例 / 教学与实践
        - 常用工具
        - 常用工具 / 进迭云
        - 常用工具 / 使用手册
        - 常用工具 / SpacemiT Studio
    validations:
      required: true
  - type: input
    id: identity
    attributes:
      label: 来源标识（可选）
      description: 通常留空：新来源默认取仓库名，句点等符号转为短横线；默认标识被占用时再填写。仅使用字母、数字、下划线和短横线。已有来源自动沿用，不得通过此字段改名。
      placeholder: 通常留空
  - type: markdown
    attributes:
      value: 提交后请在自动生成的 PR 中核对分类、来源标识和地址。新接入的地址前缀默认等于来源标识；已有来源保留原前缀及目录层级。调整显示位置不会自动迁移地址。
