name: Document governance
on:
  repository_dispatch:
    types: [document-source-merged]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  issues:
    types: [opened, edited]
permissions:
  contents: read
concurrency:
  group: document-governance-${{ github.event.client_payload.repository || github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  manual-checks:
    name: document-manual-checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check accepted immutable manifests and build reports
        shell: bash
        run: |
          set -euo pipefail
          count=0
          failed=0
          while IFS= read -r -d '' manifest; do
            relative="${manifest#document-center/releases/}"
            output="$RUNNER_TEMP/document-preview/${relative%.json}"
            count=$((count + 1))
            if ! node scripts/document-governance/run.cjs check --manifest "$manifest" --output "$output"; then
              failed=1
            fi
          done < <(find document-center/releases -type f -name '*.json' -print0 | sort -z)
          if [ "$count" -eq 0 ]; then echo 'No accepted release manifests to check'; exit 1; fi
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-manual-preview-${{ github.sha }}
          path: ${{ runner.temp }}/document-preview
          if-no-files-found: ignore
          retention-days: 14
  registration:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[文档接入]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.DOCUMENT_GOVERNANCE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/document-governance/run.cjs registration
        env:
          GH_TOKEN: ${{ secrets.DOCUMENT_GOVERNANCE_TOKEN }}
          DOCUMENT_GOVERNANCE_TEAM: ${{ vars.DOCUMENT_GOVERNANCE_TEAM }}
          DOCUMENT_GOVERNANCE_TEAM_ORG: ${{ vars.DOCUMENT_GOVERNANCE_TEAM_ORG }}
          DOCUMENT_GOVERNANCE_MAINTAINERS: ${{ vars.DOCUMENT_GOVERNANCE_MAINTAINERS }}
  governance-change:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[文档治理]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.DOCUMENT_GOVERNANCE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/document-governance/run.cjs governance-change
        env:
          GH_TOKEN: ${{ secrets.DOCUMENT_GOVERNANCE_TOKEN }}
          DOCUMENT_GOVERNANCE_TEAM: ${{ vars.DOCUMENT_GOVERNANCE_TEAM }}
          DOCUMENT_GOVERNANCE_TEAM_ORG: ${{ vars.DOCUMENT_GOVERNANCE_TEAM_ORG }}
          DOCUMENT_GOVERNANCE_MAINTAINERS: ${{ vars.DOCUMENT_GOVERNANCE_MAINTAINERS }}
  candidate:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.DOCUMENT_GOVERNANCE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/document-governance/run.cjs candidate
        env:
          GH_TOKEN: ${{ secrets.DOCUMENT_GOVERNANCE_TOKEN }}
  registration-access:
    name: document-registration-checks
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.head_ref, 'document-registration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/document-governance/run.cjs check-registration
  preview:
    name: document-release-checks
    needs: registration-access
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed' && (!startsWith(github.head_ref, 'document-registration/') || needs.registration-access.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check initial content in the onboarding PR
        if: startsWith(github.head_ref, 'document-registration/')
        run: node scripts/document-governance/run.cjs check-onboarding --output "$RUNNER_TEMP/document-preview"
      - name: Check immutable manifests and build previews
        if: startsWith(github.head_ref, 'document-release/')
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(node -e 'process.stdout.write(require("./scripts/document-governance/groups.cjs").parseReleaseBranch(process.env.RELEASE_BRANCH).file)')
          if [ ! -f "$manifest" ]; then echo 'Release manifest is missing'; exit 1; fi
          node scripts/document-governance/run.cjs check --manifest "$manifest" --output "$RUNNER_TEMP/document-preview"
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-preview-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/document-preview
          if-no-files-found: ignore
          retention-days: 14
  backend-preview:
    name: document-release-preview
    outputs:
      preview_sites: ${{ steps.staging.outputs.preview_sites }}
      review_status: ${{ steps.review.outputs.review_status }}
      review_summary: ${{ steps.review.outputs.review_summary }}
    needs: preview
    if: always() && needs.preview.result == 'success' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: document-preview
    steps:
      # Execute trusted default-branch code, never a PR's code with the preview secret.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Request backend staging artifact
        id: staging
        if: startsWith(github.head_ref, 'document-release/') || startsWith(github.head_ref, 'document-registration/')
        run: node scripts/document-governance/run.cjs backend-preview --output "$RUNNER_TEMP/backend-preview/preview.zip"
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENT_PREVIEW_URL: ${{ vars.DOCUMENT_PREVIEW_URL }}
          DOCUMENT_PREVIEW_TOKEN: ${{ secrets.DOCUMENT_PREVIEW_TOKEN }}
      - name: Install browser for deployed preview review
        if: steps.staging.outputs.preview_sites != ''
        run: npx --no-install playwright install --with-deps chromium
      - name: Review deployed document center
        id: review
        if: steps.staging.outputs.preview_sites != ''
        env:
          DOCUMENT_PREVIEW_SITES: ${{ steps.staging.outputs.preview_sites }}
        run: node scripts/document-governance/review-preview.cjs "$RUNNER_TEMP/backend-preview/review.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.staging.outputs.preview_sites != ''
        with:
          name: backend-document-preview-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/backend-preview
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && (startsWith(github.event.pull_request.head.ref, 'document-release/') || startsWith(github.event.pull_request.head.ref, 'document-registration/'))
    runs-on: ubuntu-latest
    environment: document-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/document-governance/run.cjs publish
        env:
          DOCUMENT_PUBLISH_URL: ${{ vars.DOCUMENT_PUBLISH_URL }}
          DOCUMENT_RELEASE_TOKEN: ${{ secrets.DOCUMENT_RELEASE_TOKEN }}
  report:
    needs: [registration-access, preview, backend-preview, publish]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.event.pull_request.head.ref, 'document-release/') || startsWith(github.event.pull_request.head.ref, 'document-registration/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/document-governance/run.cjs report-stage
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENT_JOB_RESULTS: ${{ toJSON(needs) }}
