name: Document source recovery
on:
  schedule:
    - cron: '0/5 * * * *'
  workflow_dispatch:
    inputs:
      source_id:
        description: 已登记的来源 ID
        type: string
      source_commit:
        description: 合并后的完整提交 SHA
        type: string
      source_pr:
        description: 已合并的业务 PR 编号
        type: string
permissions:
  contents: read
concurrency:
  group: document-source-recovery
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref_name == github.event.repository.default_branch && vars.DOCUMENT_SOURCE_RECONCILE_IDS != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.DOCUMENT_GOVERNANCE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recover missed business repository merge events
        run: node scripts/document-governance/run.cjs reconcile-sources
        env:
          GH_TOKEN: ${{ secrets.DOCUMENT_GOVERNANCE_TOKEN }}
          DOCUMENT_SOURCE_RECONCILE_IDS: ${{ vars.DOCUMENT_SOURCE_RECONCILE_IDS }}
